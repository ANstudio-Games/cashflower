name: Android release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize releases without cancelling a build already in progress.
concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      build: ${{ steps.version.outputs.build }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Check app version and existing release
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8')).expo;
            if (!/^\d+\.\d+\.\d+$/.test(app.version)) {
              throw new Error('expo.version must use major.minor.patch format');
            }
            if (!Number.isInteger(app.android.versionCode) || app.android.versionCode < 1) {
              throw new Error('expo.android.versionCode must be a positive integer');
            }
            const tag = `v${app.version}`;
            core.setOutput('version', app.version);
            core.setOutput('tag', tag);
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              core.setOutput('build', 'false');
              core.info(`${tag} already has a release; skipping.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('build', 'true');
            }

  release:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package is no longer available from sdkmanager.
          packages: platform-tools
      - name: Set signing key path
        run: echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/cashflower-release.keystore" >> "$GITHUB_ENV"
      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          for (const key of ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']) {
            if (!process.env[key]) throw new Error(`Missing GitHub secret: ${key}`);
          }
          fs.writeFileSync(process.env.ANDROID_KEYSTORE_PATH,
            Buffer.from(process.env.ANDROID_KEYSTORE_BASE64, 'base64'), { mode: 0o600 });
          NODE
      - run: npm ci
      - name: Check types and signing helper
        run: |
          npx tsc --noEmit
          node --test tests/release-workflow.test.cjs
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Configure release signing
        run: node scripts/configure-ci-android.cjs
      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Verify and prepare APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify "$APK"
          mkdir -p release
          cp "$APK" "release/cashflower-${VERSION}.apk"
          cd release
          sha256sum "cashflower-${VERSION}.apk" > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "release/cashflower-${VERSION}.apk" release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Cashflower ${VERSION}" \
            --generate-notes
      - name: Remove signing key
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"
